name: Update LeetCode badges

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update badge data
        run: node scripts/update-leetcode-badge.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "LeetCode badges are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update LeetCode badges"
          git push
